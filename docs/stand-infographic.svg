<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="1500" viewBox="0 0 2160 1500" role="img" aria-labelledby="title" aria-describedby="description">
<title id="title">STAND: Five pillars for secure agentic applications</title>
<desc id="description">Header: STAND, Secure, Trustworthy Agents by Non-negotiable Design, a security engineering framework. Title: Secure agents, built on five pillars. Five equal-height pillars, numbered 01 to 05, hold up a roof labeled Secure Agentic Applications and stand on a shared foundation labeled Security Enforced in Application Code: permissions, approvals and limits. Each pillar asks one question. Pillar 01, Risk and Responsibility, asks: What could go wrong, and who owns it? It has 6 controls. Pillar 02, Authority and Access, asks: Who may do what, and under which limits? It has 25 controls. Pillar 03, Isolation and Integrity, asks: What must stay separate and trustworthy? It has 27 controls. Pillar 04, Security Verification, asks: Can we show that the controls work? It has 10 controls. Pillar 05, Evidence and Evolution, asks: Can we see, stop, and improve behavior? It has 10 controls. Central principle: the model proposes, the application enforces. Informed by AIUC-1, ISO/IEC 42001 and NIST AI RMF. Risk taxonomy: the OWASP Top 10 for Agentic Applications. The pillars are STAND's own engineering pillars; the framework mappings are engineering mappings, not certification.</desc>
