<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="1550" viewBox="0 0 2160 1550" role="img" aria-labelledby="title description">
<title id="title">RAISE: Five pillars for secure agentic applications</title>
<desc id="description">Five equal-height architectural pillars labeled R A I S E support one shared platform labeled Secure Agentic Applications. Their shared foundation is Security Enforced in Application Code: permissions, approvals and limits. RAISE means Responsible Agentic Innovation through Secure Engineering. Its five complementary pillars are Risk and Responsibility: define the risks and assign an owner. Authority and Access: scope every identity, tool and action. Isolation and Integrity: protect data, memory and execution. Security Verification: test allowed actions and attempted bypasses. Evidence and Evolution: observe, stop, recover and improve. The model proposes, and the application enforces permissions, approvals and limits before an action. Informed by AIUC-1, ISO/IEC 42001 and NIST AI RMF. Risk coverage uses the OWASP Agentic Top 10. The pillar names are RAISE's original synthesis. A detailed explanation is provided in pillars.md.</desc>
