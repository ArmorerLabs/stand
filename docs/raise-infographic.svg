<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="1500" viewBox="0 0 2160 1500" role="img" aria-labelledby="title description">
<title id="title">RAISE: Five pillars for secure agentic applications</title>
<desc id="description">Five equal-height pillars labeled R A I S E hold up a roof labeled Secure Agentic Applications and stand on a shared foundation labeled Security Enforced in Application Code: permissions, approvals and limits. RAISE means Responsible Agentic Innovation through Secure Engineering. Each pillar asks one question. Risk and Responsibility: what could go wrong, and who owns it? Authority and Access: who may do what, and under which limits? Isolation and Integrity: what must stay separate and trustworthy? Security Verification: can we show that the controls work? Evidence and Evolution: can we see, stop, and improve behavior? Central principle: the model proposes, the application enforces. Informed by AIUC-1, ISO/IEC 42001 and NIST AI RMF. Risk coverage uses the OWASP Top 10 for Agentic Applications. The pillar names are RAISE's own engineering synthesis; the mappings are not certification. pillars.md explains each pillar.</desc>
